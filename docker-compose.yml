services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emlak
      POSTGRES_PASSWORD: emlak
      POSTGRES_DB: emlak_hub
    ports:
      - "5432:5432"
    volumes:
      - emlak_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emlak -d emlak_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  emlak_pg:
